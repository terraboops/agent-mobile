<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Strict CSP: this webview may ONLY run its own same-origin + inline agent script.
  connect-src 'none' -> no fetch/XHR/beacon/WebSocket/EventSource.
  webrtc 'block'     -> no RTCPeerConnection ICE/STUN/TURN traffic where the engine honours
                        it (Firefox). Chromium/Android WebView IGNORES this directive, so the
                        real block is the realm hardening below + the sandbox preamble
                        (bridge.js __sandboxPreamble): constructors removed from every
                        realm, no nested frames, no shadow roots. Without that, sandboxed
                        widget code could exfiltrate via STUN to an attacker host or via
                        DNS lookups of crafted names (connect-src does NOT cover WebRTC).
  img-src data:      -> no external pixels.
  frame-src 'self' data: blob: -> permits ONLY our local viz sandbox iframes (sandboxed,
  opaque-origin srcdoc frames injected by renderer.js / surface-host.js; they INHERIT this
  CSP). No other frames are allowed. The ONLY way data moves is the native channel.
  x-dns-prefetch-control: off -> <link rel=dns-prefetch/preconnect> cannot leak via DNS.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline';
               connect-src 'none'; webrtc 'block'; img-src data:; frame-src 'self' data: blob:;
               object-src 'none'; base-uri 'none'; form-action 'none'">
<meta http-equiv="x-dns-prefetch-control" content="off">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent app</title>
<style>
  /* ── Design tokens: futuristic, near-black, single luminous accent ──────────── */
  :root {
    color-scheme: dark;
    --surface:#0B0F14; --panel:#111823; --panel-hi:#151F2B; --hairline:#1E2A38;
    --ink:#E6EDF3; --muted:#8B98A9;
    --accent:#22D3EE; --accent-dim:rgba(34,211,238,.14); --accent-2:#7C5CFF;
    --pos:#3FB950; --warn:#F0883E; --danger:#FF5C5C;
    --glow:0 0 14px rgba(34,211,238,.45);
    --r-sm:8px; --r:12px; --r-lg:16px; --r-pill:999px;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --sans:-apple-system,system-ui,"Segoe UI",sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 var(--sans); background: var(--surface); color: var(--ink);
         background-image:
           radial-gradient(1200px 480px at 50% -8%, rgba(34,211,238,.06), transparent 60%),
           linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px),
           linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px);
         background-size: auto, 40px 40px, 40px 40px; }
  .icon { width: 1em; height: 1em; display: inline-block; vertical-align: -.14em; flex: none; }
  /* Trust/identity is shown by the NATIVE overlay badge (unforgeable). The webview header
     makes no connection claim — agent JS can rewrite this DOM freely, so we never trust it. */
  #badge { position: sticky; top: 0; z-index: 30; padding: 10px 16px;
           background: rgba(11,15,20,.72); backdrop-filter: blur(10px) saturate(1.3);
           border-bottom: 1px solid var(--hairline);
           font: 600 11px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--ink); }
  #badge .key { font-family: var(--mono); color: var(--muted); letter-spacing: .1em; }
  /* Live status strip: heartbeat dot, mic level, "heard", agent working/progress. */
  #status { display: flex; align-items: center; gap: 12px; margin-top: 9px;
            font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: none; color: var(--muted); }
  #hb { width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
        box-shadow: var(--glow); font-size: 0; }
  #hb.off { background: var(--danger); box-shadow: 0 0 10px rgba(255,92,92,.5); }
  #hb.pulse { animation: hbpulse 1.4s infinite ease-in-out; }
  @keyframes hbpulse { 0%,100% { opacity: 1; box-shadow: var(--glow); } 50% { opacity: .35; box-shadow: 0 0 4px rgba(34,211,238,.3); } }
  .miclvl { width: 72px; height: 6px; background: var(--panel); border: 1px solid var(--hairline);
            border-radius: var(--r-pill); overflow: hidden; display: inline-block; }
  .miclvl i { display: block; height: 100%; width: 0%; border-radius: var(--r-pill);
              background: linear-gradient(90deg, var(--accent-2), var(--accent)); box-shadow: var(--glow);
              transition: width .09s linear; }
  .st { display: none; align-items: center; gap: 5px; }
  .st.show { display: inline-flex; }
  #heard.show { color: var(--accent); }
  #heard .icon { color: var(--accent); }
  #work.show { color: var(--warn); }
  h1 { font-size: 17px; margin: 0 0 12px; letter-spacing: -.01em; }
  ul { list-style: none; margin: 0 0 16px; padding: 0; }
  li { padding: 12px 14px; background: linear-gradient(var(--panel), var(--surface));
       border: 1px solid var(--hairline); border-radius: var(--r); margin-bottom: 8px;
       box-shadow: inset 0 1px 0 rgba(255,255,255,.02); }
  li em { float: right; color: var(--accent); font-style: normal; font: 500 13px/1.5 var(--mono); }
  button { width: 100%; padding: 12px; background: var(--accent-dim); color: var(--accent);
           border: 1px solid rgba(34,211,238,.4); border-radius: var(--r); font: 600 15px var(--sans);
           letter-spacing: .01em; transition: background .15s, box-shadow .15s, border-color .15s; }
  button:active { background: rgba(34,211,238,.24); box-shadow: var(--glow); }
  .muted { color: var(--muted); }
  #ui { padding: 18px; max-width: 560px; margin: 0 auto; padding-bottom: 6px; }
  .img { margin: 12px 0; }
  .img img { max-width: 100%; border-radius: var(--r); display: block; border: 1px solid var(--hairline); }
  .img figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
  /* Mic + Stop are REQUIRED components. They arrive over the wire as a styled
     `controls` block and stay pinned to the bottom of the message area so a long
     reply can never hide them. */
  .controls { position: sticky; bottom: 0; display: flex; gap: 10px; align-items: stretch;
              margin-top: 14px; padding: 10px 2px 14px;
              background: linear-gradient(rgba(11,15,20,0), var(--surface) 30%); }
  .controls button { flex: 1 1 auto; margin: 0; }
  .chart { width: 100%; height: 260px; margin: 12px 0; }
  /* Display-surface widget tiles (docs/display-surface.md). Persistent, additive,
     keyed viewport: an update re-renders ONLY its own tile, never peers or #ui. */
  #surface { max-width: 560px; margin: 0 auto; padding: 0 18px; }
  /* Always-on MIC control: a ring that pulses with YOUR voice input, and is the
     mute/unmute button. FILLED = mic live (unmuted); EMPTY/hollow = mic muted.
     Tap toggles the native mic. A small Stop sits beside it for interrupting the
     agent's current turn. */
  /* Native mic button (issue #1) occupies the bottom-left; reserve that slot and push the
     web Stop button to the right so they sit side by side without overlapping. */
  #ctrlbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
             display: flex; align-items: center; gap: 22px; justify-content: flex-end;
             padding: 10px 18px calc(16px + env(safe-area-inset-bottom)) 108px;
             background: linear-gradient(transparent, var(--surface) 42%); }
  /* The mic/mute control is now a NATIVE Android button (issue #1) — hide the web ring so
     the native one is the single source of truth and cannot wedge/drift. */
  #mic-ring { display: none !important; }
  #mic-ring-legacy { width: 76px; height: 76px; border-radius: 50%; border: 2px solid var(--accent);
              background: transparent; color: var(--ink); position: relative;
              display: flex; align-items: center; justify-content: center;
              transition: background .15s, border-color .15s, box-shadow .15s, color .15s; }
  #mic-ring-legacy .icon { width: 30px; height: 30px; }
  #mic-ring.unmuted { background: var(--accent-dim); border-color: var(--accent); box-shadow: var(--glow); }
  #mic-ring.muted   { background: transparent; border-color: var(--hairline); color: var(--muted); box-shadow: none; }
  #mic-ring.pulse   { animation: mring 1.1s infinite; }
  @keyframes mring { 0%,100% { box-shadow: 0 0 0 3px rgba(34,211,238,.28); }
                     50% { box-shadow: 0 0 0 22px rgba(34,211,238,0); } }
  #ctl-stop { flex: 1 1 auto; width: auto; min-width: 60px; padding: 14px 18px; border: 1px solid rgba(255,92,92,.45);
              border-radius: var(--r-lg); font: 600 15px var(--sans); color: var(--danger);
              background: rgba(255,92,92,.12); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  #ctl-stop:active { background: rgba(255,92,92,.22); }
  #ctl-stop .icon { width: 16px; height: 16px; }

  /* Agent voice indicator — a floating "default example widget" shown while the
     agent is speaking. Sits above the content; NOT interactive with the mic.
     A few creative visual variants, switchable by tapping it. */
  #agentSpeech { position: fixed; top: 14px; left: 0; right: 0; z-index: 45;
                 display: none; justify-content: center; pointer-events: none; }
  #agentSpeech.show { display: flex; }
  #agentSpeech .speech-widget { pointer-events: auto; cursor: pointer; width: 88px; height: 28px;
                 display: flex; align-items: center; justify-content: center; gap: 4px;
                 background: rgba(17,24,35,.82); backdrop-filter: blur(8px); border: 1px solid var(--hairline);
                 border-radius: var(--r-pill); padding: 6px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.45), var(--glow); }
  /* v1 — equalizer bars */
  #agentSpeech .sp-speech.bars .spbar { width: 4px; border-radius: 3px;
                 background: linear-gradient(var(--accent), var(--accent-2));
                 animation: spbar .9s infinite ease-in-out; }
  #agentSpeech .sp-speech.bars .spbar:nth-child(1){ animation-delay:-.1s; } .spbar:nth-child(2){ animation-delay:-.35s; }
  #agentSpeech .sp-speech.bars .spbar:nth-child(3){ animation-delay:-.6s; } .spbar:nth-child(4){ animation-delay:-.2s; }
  @keyframes spbar { 0%,100%{ height:6px; opacity:.55 } 50%{ height:18px; opacity:1 } }
  /* v2 — glowing orb */
  #agentSpeech .sp-speech.orb { width: 16px; height: 16px; border-radius: 50%;
                 background: var(--accent); animation: sporb 1.1s infinite; box-shadow: 0 0 14px var(--accent); }
  @keyframes sporb { 0%,100%{ transform: scale(1); opacity:.7 } 50%{ transform: scale(1.5); opacity:1 } }
  /* v3 — speaking dots */
  #agentSpeech .sp-speech.dots { font: 12px/1 var(--mono); letter-spacing: 2px; color: var(--accent); }
  #agentSpeech .sp-speech.dots::after { content: ''; animation: spdots 1.2s steps(1) infinite; }
  @keyframes spdots { 0%{content:''} 25%{content:'·'} 50%{content:'··'} 75%{content:'···'} 100%{content:'····'} }
  .swidget { margin: 0 0 14px; }
  .swidget .swtext { margin: 0 0 10px; }
  .swidget img { max-width: 100%; border-radius: var(--r); display: block; border: 1px solid var(--hairline); }
  .swidget figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .chartbox { width: 100%; }
  .vizerr { color: var(--danger); padding: 8px 10px; font: 12px/1.4 var(--mono);
            border: 1px dashed var(--hairline); border-radius: var(--r-sm); }
  /* Arbitrary visualization sandbox: an opaque-origin iframe the agent's code runs
     in. It can draw on its own canvas but has no access to the bridge/mic/identity. */
  .viz { width: 100%; height: 320px; margin: 12px 0; border: 1px solid var(--hairline);
         border-radius: var(--r); overflow: hidden; }
  .viz iframe { width: 100%; height: 100%; border: 0; background: var(--surface); }
  /* Session bootstrap: shown on open; choices are native-ish UI outside #ui. */
  #boot { position: fixed; inset: 0; z-index: 50; background: rgba(11,15,20,.94); backdrop-filter: blur(6px);
          display: flex; align-items: center; justify-content: center; }
  #boot .box { max-width: 320px; width: 100%; text-align: center; padding: 26px;
               background: var(--panel); border: 1px solid var(--hairline); border-radius: var(--r-lg);
               box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #boot h2 { margin: 0 0 8px; font-size: 18px; letter-spacing: .01em; }
  #boot p { margin: 0 0 18px; }
  #boot button { margin-top: 10px; }
</style>
</head>
<body>
  <header id="badge">agent terminal
    <div id="status">
      <span id="hb" title="heartbeat">●</span>
      <span class="miclvl" id="miclvl" title="mic pickup"><i id="micfill"></i></span>
      <span id="heard" class="st"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 12h2l2 5 4-14 2.5 9H18"/><path d="M20 9v6"/></svg>heard</span>
      <span id="work" class="st">working… <span id="workprog"></span></span>
    </div>
  </header>
  <main id="ui"><p class="muted">Waiting for the agent…</p></main>
  <div id="surface"></div>
  <div id="agentSpeech" aria-hidden="true">
    <div id="speechWidget" class="speech-widget"></div>
  </div>
  <div id="ctrlbar">
    <button id="mic-ring" class="muted" title="tap to mute / unmute mic"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg></button>
    <button id="ctl-stop" title="stop the agent"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>Stop</button>
  </div>
  <div id="boot">
    <div class="box">
      <h2>Agent Mobile</h2>
      <p class="muted">Start fresh, or pick up where you left off?<br>(Start new reloads the agent's skills &amp; clears history)</p>
      <button data-boot="new" onclick="if(window.__bootstrap){document.getElementById('boot').style.display='none';window.__bootstrap('new')}">Start new conversation</button>
      <button data-boot="resume" onclick="if(window.__bootstrap){document.getElementById('boot').style.display='none';window.__bootstrap('resume')}">Resume conversation</button>
    </div>
  </div>
  <script>(function(){
  // WebRTC is NOT governed by connect-src, and Chromium (Android WebView) ignores the CSP
  // `webrtc` directive (Firefox-only). So: remove the constructors from this realm. Every
  // sandbox document gets the same treatment plus child-src 'none' (no nested realms) —
  // see window.__sandboxPreamble in bridge.js.
  var N=['RTCPeerConnection','webkitRTCPeerConnection','mozRTCPeerConnection','RTCDataChannel','RTCIceCandidate','RTCSessionDescription','RTCDtlsTransport','RTCIceTransport','RTCSctpTransport','RTCRtpSender','RTCRtpReceiver','RTCRtpTransceiver'];
  for (var i=0;i<N.length;i++){ try{ Object.defineProperty(window,N[i],{value:undefined,writable:false,configurable:false,enumerable:false}); }catch(e){} }
})();</script>
  <!-- Gateway address comes from config.local.js (gitignored). Copy config.example.js to set it. -->
  <script src="/config.local.js"></script>
  <script src="/bridge.js"></script>
  <script src="/vendor/apexcharts.min.js"></script>
  <script src="/renderer.js"></script>
  <script type="module" src="/surface-host.js"></script>
</body>
</html>
