<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Strict CSP: this webview may ONLY run its own same-origin + inline agent script.
  connect-src 'none' -> no fetch/XHR/beacon. img-src data: -> no external pixels.
  frame-src 'self' data: blob: -> permits ONLY our local viz sandbox iframe (a
  sandboxed, opaque-origin frame injected by renderer.js). No other frames are allowed.
  The ONLY way data moves is the native channel.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline';
               connect-src 'none'; img-src data:; frame-src 'self' data: blob:; object-src 'none';
               base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent app</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 15px/1.45 -apple-system, system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
  /* Trust/identity is shown by the NATIVE overlay badge (unforgeable). The webview header
     makes no connection claim — agent JS can rewrite this DOM freely, so we never trust it. */
  #badge { position: sticky; top: 0; padding: 8px 14px; background: #0d1117;
           font-size: 13px; color: #e6edf3; letter-spacing: .03em; }
  #badge .key { font-family: ui-monospace, monospace; color: #8b949e; }
  /* Live status strip: heartbeat dot, mic level, "heard", agent working/progress. */
  #status { display: flex; align-items: center; gap: 12px; margin-top: 8px;
            font-size: 12px; color: #8b949e; letter-spacing: 0; }
  #hb { color: #3fb950; font-size: 14px; }
  #hb.off { color: #da3633; }
  #hb.pulse { animation: hbpulse 1.2s infinite; }
  @keyframes hbpulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .miclvl { width: 72px; height: 8px; background: #161b22; border-radius: 4px; overflow: hidden; display: inline-block; }
  .miclvl i { display: block; height: 100%; width: 0%; background: #8957e5; transition: width .09s linear; }
  .st { display: none; }
  .st.show { display: inline; }
  #heard.show { color: #3fb950; }
  #work.show { color: #f0883e; }
  h1 { font-size: 17px; margin: 0 0 10px; }
  ul { list-style: none; margin: 0 0 16px; padding: 0; }
  li { padding: 10px 12px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 8px; }
  li em { float: right; color: #f0883e; font-style: normal; }
  button { width: 100%; padding: 12px; background: #238636; color: #fff; border: 0; border-radius: 8px; font-size: 15px; }
  button:active { background: #1a7f26; }
  .muted { color: #8b949e; }
  #ui { padding: 18px; max-width: 560px; margin: 0 auto; padding-bottom: 6px; }
  .img { margin: 12px 0; }
  .img img { max-width: 100%; border-radius: 10px; display: block; }
  .img figcaption { font-size: 12px; color: #8b949e; margin-top: 4px; }
  /* Mic + Stop are REQUIRED components. They arrive over the wire as a styled
     `controls` block and stay pinned to the bottom of the message area so a long
     reply can never hide them. */
  .controls { position: sticky; bottom: 0; display: flex; gap: 10px; align-items: stretch;
              margin-top: 14px; padding: 10px 2px 14px; background: linear-gradient(#0d111700, #0d1117 30%); }
  .controls button { flex: 1 1 auto; margin: 0; }
  .chart { width: 100%; height: 260px; margin: 12px 0; }
  /* Display-surface widget tiles (docs/display-surface.md). Persistent, additive,
     keyed viewport: an update re-renders ONLY its own tile, never peers or #ui. */
  #surface { max-width: 560px; margin: 0 auto; padding: 0 18px; }
  /* Always-on control bar (mic + stop) — pinned so the agent can NEVER hide or
     omit the mute/stop controls. This is the reliable mute for the user, present
     on every render regardless of what the agent ships. #boot covers it initially. */
  #ctrlbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
             display: flex; gap: 10px; padding: 10px 18px calc(14px + env(safe-area-inset-bottom));
             background: linear-gradient(transparent, #0d1117 42%); justify-content: center; }
  #ctrlbar button { flex: 1 1 0; max-width: 230px; padding: 13px; border: 0;
                    border-radius: 12px; font-size: 15px; color: #fff; }
  #ctl-mic { background: #8957e5; }
  #ctl-stop { background: #da3633; }
  .swidget { margin: 0 0 14px; }
  .swidget .swtext { margin: 0 0 10px; }
  .swidget img { max-width: 100%; border-radius: 10px; display: block; }
  .swidget figcaption { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .chartbox { width: 100%; }
  .vizerr { color: #e06c75; padding: 8px 10px; font: 12px/1.4 monospace;
            border: 1px dashed #21262d; border-radius: 8px; }
  /* Arbitrary visualization sandbox: an opaque-origin iframe the agent's code runs
     in. It can draw on its own canvas but has no access to the bridge/mic/identity. */
  .viz { width: 100%; height: 320px; margin: 12px 0; border: 1px solid #21262d; border-radius: 10px; overflow: hidden; }
  .viz iframe { width: 100%; height: 100%; border: 0; background: #0d1117; }
  /* Session bootstrap: shown on open; choices are native-ish UI outside #ui. */
  #boot { position: fixed; inset: 0; z-index: 50; background: rgba(13,17,23,.97);
          display: flex; align-items: center; justify-content: center; }
  #boot .box { max-width: 320px; width: 100%; text-align: center; padding: 24px; }
  #boot h2 { margin: 0 0 8px; font-size: 18px; }
  #boot p { margin: 0 0 18px; }
  #boot button { margin-top: 10px; }
</style>
</head>
<body>
  <header id="badge">agent terminal
    <div id="status">
      <span id="hb" title="heartbeat">●</span>
      <span class="miclvl" id="miclvl" title="mic pickup"><i id="micfill"></i></span>
      <span id="heard" class="st">👂</span>
      <span id="work" class="st">working… <span id="workprog"></span></span>
    </div>
  </header>
  <main id="ui"><p class="muted">Waiting for the agent…</p></main>
  <div id="surface"></div>
  <div id="ctrlbar">
    <button id="ctl-mic">🎤 Start audio</button>
    <button id="ctl-stop">✕ Stop</button>
  </div>
  <div id="boot">
    <div class="box">
      <h2>Agent Mobile</h2>
      <p class="muted">Start fresh, or pick up where you left off?<br>(Start new reloads the agent's skills &amp; clears history)</p>
      <button data-boot="new" onclick="if(window.__bootstrap){document.getElementById('boot').style.display='none';window.__bootstrap('new')}">Start new conversation</button>
      <button data-boot="resume" onclick="if(window.__bootstrap){document.getElementById('boot').style.display='none';window.__bootstrap('resume')}">Resume conversation</button>
    </div>
  </div>
  <script>window.AGENT_URL = 'ws://YOUR-GATEWAY-HOST:8123';</script>
  <script src="/bridge.js"></script>
  <script src="/vendor/apexcharts.min.js"></script>
  <script src="/renderer.js"></script>
  <script type="module" src="/surface-host.js"></script>
</body>
</html>
