<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Strict CSP: this webview may ONLY run its own same-origin + inline agent script.
  connect-src 'none' -> no fetch/XHR/beacon. img-src 'none' -> no external pixels.
  frame-src 'none' -> no iframes. The ONLY way data moves is the native channel.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline';
               connect-src 'none'; img-src 'none'; frame-src 'none'; object-src 'none';
               base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent app</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 15px/1.45 -apple-system, system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
  #badge { position: sticky; top: 0; padding: 8px 14px; background: #161b22; border-bottom: 1px solid #30363d;
           font-size: 12px; color: #7ee787; letter-spacing: .03em; }
  #badge .key { font-family: ui-monospace, monospace; color: #8b949e; }
  #ui { padding: 18px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 0 10px; }
  ul { list-style: none; margin: 0 0 16px; padding: 0; }
  li { padding: 10px 12px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 8px; }
  li em { float: right; color: #f0883e; font-style: normal; }
  button { width: 100%; padding: 12px; background: #238636; color: #fff; border: 0; border-radius: 8px; font-size: 15px; }
  button:active { background: #1a7f26; }
  .muted { color: #8b949e; }
</style>
</head>
<body>
  <header id="badge">CONNECTED TO AGENT · <span class="key" id="agentid">···</span></header>
  <main id="ui"><p class="muted">Waiting for the agent…</p></main>
  <script src="/bridge.js"></script>
  <script src="/renderer.js"></script>
</body>
</html>
